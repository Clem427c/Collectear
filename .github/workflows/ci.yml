name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sql:
    # Schéma de la base en ligne testé sur un PostgreSQL vierge (RLS, anti-triche, ré-exécutable).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Tester supabase/schema.sql
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: supabase/test/run.sh

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Version de Flutter
        run: flutter --version

      - name: Générer les dossiers plateforme (web, android)
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          flutter create . --platforms=web,android --project-name collectear --org com.clem427c --no-overwrite
          # flutter create ajoute un test d'exemple qui ne correspond pas à notre app
          git ls-files --error-unmatch test/widget_test.dart >/dev/null 2>&1 || rm -f test/widget_test.dart
          # Accès Internet en release (serveur en ligne Supabase)
          m=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$m" || \
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$m"
          grep -n 'INTERNET' "$m"
          # Lien de connexion de l'e-mail → ouvre l'appli (com.clem427c.collectear://login-callback).
          # Le deep linking de Flutter est coupé : c'est supabase_flutter (app_links) qui lit le lien.
          python3 - "$m" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p).read()
          if 'login-callback' not in s:
              block = '''            <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="com.clem427c.collectear" android:host="login-callback" />
                      </intent-filter>
                      <meta-data android:name="flutter_deeplinking_enabled" android:value="false" />
                  </activity>'''
              assert s.count('</activity>') == 1, 'une seule activité attendue'
              s = s.replace('</activity>', block.strip(), 1)
              open(p, 'w').write(s)
          PY
          grep -n 'login-callback\|deeplinking' "$m"
          # AdMob (vidéos récompensées) : identifiant d'appli obligatoire dans le manifeste, sinon l'appli
          # plante au démarrage. Secret ADMOB_APP_ID s'il existe, sinon l'identifiant de TEST de Google.
          python3 - "$m" "$ADMOB_APP_ID" <<'PY'
          import re, sys
          p, given = sys.argv[1], sys.argv[2].strip()
          app_id = given if re.fullmatch(r'ca-app-pub-\d{16}~\d{10}', given) else 'ca-app-pub-3940256099942544~3347511713'
          print('AdMob :', 'identifiant du secret ADMOB_APP_ID' if app_id == given else 'identifiant de TEST')
          s = open(p).read()
          if 'gms.ads.APPLICATION_ID' not in s:
              assert s.count('</application>') == 1
              s = s.replace('</application>', '    <meta-data android:name="com.google.android.gms.ads.APPLICATION_ID" '
                            f'android:value="{app_id}"/>\n    </application>', 1)
              open(p, 'w').write(s)
          PY
          grep -n 'gms.ads' "$m"
          # google_mobile_ads demande un minSdk récent : au moins 23 (sans baisser celui de Flutter).
          g=android/app/build.gradle.kts
          if [ -f "$g" ]; then
            sed -i -E 's/minSdk *= *flutter\.minSdkVersion/minSdk = maxOf(flutter.minSdkVersion, 23)/' "$g"
          else
            g=android/app/build.gradle
            sed -i -E 's/minSdk(Version)? *=? *flutter\.minSdkVersion/minSdkVersion Math.max(flutter.minSdkVersion, 23)/' "$g"
          fi
          grep -n 'minSdk' "$g"

      - name: Illustrations (art/raw → assets/cards)
        run: |
          python3 -m pip install --quiet pillow numpy scipy || python3 -m pip install --quiet --break-system-packages pillow numpy scipy
          python3 tool/process_art.py
          python3 tool/process_decors.py

      - name: Vérifier les secrets Supabase (sans les afficher)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          url="$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]')"
          key="$(printf '%s' "$SUPABASE_PUBLISHABLE_KEY" | tr -d '[:space:]')"
          if [ -z "$url" ] || [ -z "$key" ]; then
            echo "::warning::Secrets Supabase absents : l'app sera construite en mode hors ligne."
            exit 0
          fi
          case "$url" in
            https://*) echo "SUPABASE_URL : présente, commence par https:// (${#url} caractères)" ;;
            *) echo "::warning::SUPABASE_URL ne commence pas par https://" ;;
          esac
          case "$url" in
            *.supabase.co|*.supabase.co/) echo "SUPABASE_URL : domaine supabase.co" ;;
            *) echo "::notice::SUPABASE_URL n'est pas un domaine *.supabase.co (domaine personnalisé ?)" ;;
          esac
          case "$key" in
            sb_publishable_*) echo "SUPABASE_PUBLISHABLE_KEY : clé publique sb_publishable_ (${#key} caractères)" ;;
            sb_secret_*) echo "::error::SUPABASE_PUBLISHABLE_KEY contient une clé SECRÈTE : remplace-la par la clé publishable"; exit 1 ;;
            eyJ*) echo "SUPABASE_PUBLISHABLE_KEY : ancienne clé JWT (${#key} caractères)" ;;
            *) echo "::warning::SUPABASE_PUBLISHABLE_KEY a un format inattendu" ;;
          esac

      - name: Base Supabase installée ? (lecture anonyme, sans rien afficher de secret)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          url="$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]')"; url="${url%/}"
          key="$(printf '%s' "$SUPABASE_PUBLISHABLE_KEY" | tr -d '[:space:]')"
          [ -n "$url" ] && [ -n "$key" ] || { echo "Secrets absents : vérification ignorée."; exit 0; }
          # Chaque objet attendu de supabase/schema.sql : table (GET) ou fonction (POST rpc, sans session → refus attendu).
          check() {
            code=$(curl -s -o /tmp/r.json -w '%{http_code}' --max-time 15 "$@" -H "apikey: $key" -H "Authorization: Bearer $key" -H 'Content-Type: application/json')
            if grep -q 'PGRST205\|PGRST202\|42P01\|42883' /tmp/r.json; then echo "absent"; else echo "présent (HTTP $code)"; fi
          }
          for t in profiles owned_cards runs friendships trades trade_items wishlist; do
            echo "Table $t : $(check "$url/rest/v1/$t?select=*&limit=0")"
          done
          # Seulement des fonctions sans paramètre : avec {} une fonction à paramètres répondrait « introuvable ».
          for f in start_run my_stats my_trades friends_leaderboard my_wishlist; do
            echo "Fonction $f : $(check -X POST "$url/rest/v1/rpc/$f" -d '{}')"
          done
          r=$(check "$url/rest/v1/trade_items?select=*&limit=0")
          case "$r" in
            absent*) echo "::notice::Base Supabase pas à jour : coller supabase/schema.sql dans le SQL Editor (docs/SUPABASE.md)." ;;
          esac

      - name: Dépendances
        run: flutter pub get

      - name: Analyse
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test

      - name: Build web
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: >
          flutter build web --release --base-href "/${{ github.event.repository.name }}/"
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Test de fumée web (lance une run dans Chromium, captures dans le journal)
        continue-on-error: true
        timeout-minutes: 8
        run: |
          python3 -m pip install --quiet playwright || python3 -m pip install --quiet --break-system-packages playwright
          python3 -m playwright install --with-deps chromium > /dev/null
          python3 tool/web_smoke.py build/web

      - name: Build APK
        env:
          ADMOB_REWARDED_ANDROID: ${{ secrets.ADMOB_REWARDED_ANDROID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: >
          flutter build apk --release
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"
          --dart-define=ADMOB_REWARDED_ANDROID="$ADMOB_REWARDED_ANDROID"

      - name: Renommer l'APK
        run: cp build/app/outputs/flutter-apk/app-release.apk collectear.apk

      - uses: actions/upload-artifact@v4
        with:
          name: collectear-apk
          path: collectear.apk

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: build/web

      - name: Publier l'APK (release)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: |
            Build automatique du commit ${{ github.sha }}.
            Lien permanent vers le dernier APK : https://github.com/${{ github.repository }}/releases/latest/download/collectear.apk
          files: collectear.apk
          make_latest: true

  android-smoke:
    # Installe l'APK sur un émulateur Android, le lance et relève les plantages (journal logcat + capture).
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: collectear-apk
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Lancer l'appli sur un émulateur (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            adb install -r collectear.apk
            adb logcat -c
            adb shell monkey -p com.clem427c.collectear -c android.intent.category.LAUNCHER 1
            sleep 40
            adb exec-out screencap -p > android-lancement.png || true
            adb logcat -d > logcat.txt || true
            echo "=== Processus de l'appli ==="; adb shell pidof com.clem427c.collectear || echo "PAS EN COURS D'EXÉCUTION"
            echo "=== Plantages (AndroidRuntime / FATAL) ==="; grep -E -A40 'FATAL EXCEPTION|AndroidRuntime: |Abort message|F DEBUG|F libc' logcat.txt | head -200 || true
            echo "=== Flutter ==="; grep -E ' flutter ' logcat.txt | head -60 || true
            if grep -q 'FATAL EXCEPTION' logcat.txt; then echo "::error::L'appli plante au lancement sur Android (voir le journal ci-dessus)"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke
          path: |
            logcat.txt
            android-lancement.png

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
